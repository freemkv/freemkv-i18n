name: CI

on:
  push:
    # dev -> qa -> main. `dev` is where work lands and is meant to be pushed
    # to often: these are the FAST checks, so a mistake surfaces in minutes.
    # `qa` is the release candidate — it runs these too, plus the expensive
    # suite in qa.yml. `main` only ever moves at release time, to a tagged
    # commit that was already green on qa.
    branches: [main, dev, qa]
  pull_request:

# freemkv-i18n has no freemkv dependencies — it is a leaf the front-ends
# (freemkv, autorip) consume — so no sibling checkout is needed. It carries a
# build.rs that bakes the `locales/` tree into the binary, and that codegen is
# the part most likely to behave differently per OS, so it gets the full matrix.
#
# Cargo.lock is gitignored (library convention), so `--locked` is deliberately
# NOT used: with no committed lockfile it fails rather than resolves.

jobs:
  # CI owns the changelog: main may never carry a released version without a
  # CHANGELOG.md entry for it. The release orchestrator dates an existing
  # `## [X.Y.Z]` heading — it does NOT invent one — so a version bump that
  # forgot its changelog entry must fail here rather than ship a blank release.
  # Hard-fails on main (and PRs targeting main); warns elsewhere so an
  # in-progress dev/qa branch whose entry isn't written yet is not blocked.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require a CHANGELOG entry for the crate version on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for ${version}."
            exit 0
          fi
          msg="CHANGELOG.md has no '## [${version}]' entry"
          if [ "${GITHUB_REF_NAME:-}" = "main" ] || [ "${GITHUB_BASE_REF:-}" = "main" ]; then
            echo "::error::${msg} — main requires a changelog entry for the released version."
            exit 1
          fi
          echo "::warning::${msg} (allowed on ${GITHUB_REF_NAME:-unknown}; required before it can reach main)."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: freemkv-i18n-ci
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: freemkv-i18n-ci
      - run: cargo test --tests

  # src/error_codes.rs is a CHECKED-IN copy of libfreemkv's error-code
  # constants: this crate must not DEPEND on libfreemkv (it git-deps the private
  # freemkv-unlock, which would make freemkv-i18n unbuildable in its own CI), so
  # the copy is kept in sync by hand via ci/sync-error-codes.sh. The
  # `libfreemkv_code_list_has_not_drifted` test proves the copy is current, but
  # only where a sibling libfreemkv checkout exists — which is NEVER this crate's
  # own CI. That gap is exactly how E6019 shipped in libfreemkv while the copy
  # here (and the 29 catalogs) stayed a code behind. This job closes it: it
  # sparse-checks-out libfreemkv's single public `src/error.rs`, regenerates the
  # registry, and fails the build if the checked-in copy differs — so a new
  # libfreemkv code can no longer drift in silently. It reads ONE file and takes
  # no dependency, so the "no sibling checkout" rule the rest of this workflow
  # follows is preserved. (The durable fix is for libfreemkv to emit its code
  # list from a build.rs `pub const`, letting this crate consume one authority
  # instead of a copy — tracked upstream; until then, this diff guards it.)
  error-code-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch libfreemkv error.rs
        uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          path: .libfreemkv-src
          sparse-checkout: src/error.rs
          sparse-checkout-cone-mode: false
      - name: Regenerate the error-code registry and fail on drift
        run: |
          ci/sync-error-codes.sh .libfreemkv-src/src/error.rs
          git diff --exit-code -- src/error_codes.rs \
            || { echo "::error::src/error_codes.rs is out of date with libfreemkv/src/error.rs. Run ci/sync-error-codes.sh and add an English string (in all 29 locales) for any new code."; exit 1; }

  # build.rs walks `locales/` and emits Rust source. Path handling in a build
  # script is exactly the kind of thing that works on Linux and fails on
  # Windows, so both other OSes compile the tests here rather than at tag time.
  check-macos:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: freemkv-i18n-ci
      - run: cargo build --tests

  # Additive, NON-REQUIRED coverage job: gathers line coverage with
  # cargo-llvm-cov and uploads to Codecov (tokenless — public repo). It never
  # gates a merge (codecov.yml marks the project status informational and
  # fail_ci_if_error is false), and it is deliberately not wired into any
  # release gate. Cargo.lock is gitignored here (see header), so --locked is
  # intentionally omitted, matching the test/lint jobs.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: freemkv-i18n-coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --ignore-run-fail --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          slug: freemkv/freemkv-i18n
          fail_ci_if_error: false

  check-windows:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: freemkv-i18n-ci
      - run: cargo build --tests
